name: Release

# CD: tag v* on main → full verification → Beamhop.app attached to a GitHub Release.
# NOTE the artifact is ad-hoc signed — fine for the owner's own Macs; distributing to others
# requires Developer ID signing + notarization (see docs/superpowers/specs/2026-09-14-evolution-decisions.md §1).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build all Swift products
        run: swift build
      - name: Swift tests
        run: swift test
      - name: Self-test (28 storage checks)
        run: swift run BeamhopSelfTest
      - name: MCP stdio smoke test
        run: scripts/mcp-smoke.sh
      - name: Native manifest installer smoke test
        run: scripts/native-manifest-smoke.sh
      - name: Assemble Beamhop.app (ad-hoc)
        run: ./packaging/build-app.sh
      - name: Zip Beamhop.app (ditto preserves permissions/metadata)
        run: cd dist && ditto -c -k --keepParent Beamhop.app "Beamhop-${GITHUB_REF_NAME}-macos.app.zip"
      - name: Create GitHub Release with the app
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Beamhop ${{ github.ref_name }}**

            ⚠️ ad-hoc 签名构建,未公证。自己的 Mac 可用(首次需在系统设置里允许);分发给他人前需要 Developer ID 签名 + 公证。

            解压后拖入 /Applications;注册命令见 [packaging/README.md](../blob/main/packaging/README.md)。
