name: Complete phase15 PR description

on:
  push:
    branches: [feat/phase15-detail-chain]
    paths: [.github/workflows/update-feature-pr.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: 7});
              if (pr.head.ref !== 'feat/phase15-detail-chain' || pr.base.ref !== 'main' || pr.state !== 'open') {
                throw new Error('PR branch or state changed; leaving its description untouched.');
              }
              const proposed = fs.readFileSync('.github/phase15-pr-body.md', 'utf8');
              const template = fs.readFileSync('.github/pull_request_template.md', 'utf8');
              const normalize = s => s.replace(/<!--[^]*?-->/g, '').replace(/\s/g, '');
              const prior = pr.body || '';
              const body = !normalize(prior) || normalize(prior) === normalize(template)
                ? proposed : (prior.includes('152/152 UI assertions') ? prior : prior + '\n\n' + proposed);
              const title = pr.title === 'Feat/phase15 detail chain'
                ? 'Refine native capture handoffs, add the corner shelf and Inbox timeline' : pr.title;
              const { data: updated } = await github.rest.pulls.update({...context.repo, pull_number: 7, title, body});
              fs.writeFileSync('pr-result.json', JSON.stringify({url: updated.html_url, title: updated.title, draft: updated.draft, body: updated.body}, null, 2));
            } catch (error) {
              fs.writeFileSync('pr-result.json', JSON.stringify({status: error.status, error: error.message}, null, 2));
              core.setFailed(error.message);
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-pr-description-result
          path: pr-result.json
          retention-days: 7
