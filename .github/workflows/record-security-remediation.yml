name: Record signing credential remediation in PR

on:
  push:
    branches: [feat/phase15-detail-chain]
    paths: [.github/workflows/record-security-remediation.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: 7});
            if (pr.head.ref !== 'feat/phase15-detail-chain' || pr.base.ref !== 'main' || pr.state !== 'open') {
              throw new Error('PR branch or state changed; no update made.');
            }
            const heading = '## Signing credential remediation';
            if (!(pr.body || '').includes(heading)) {
              const note = [
                heading,
                '',
                'GitGuardian found a fixed development-keychain password in the earlier setup and packaging scripts. Both defaults were removed. Setup now requires a privately supplied secret or hidden terminal input; explicit unlock failure stops packaging. Password handling disables shell tracing and removes the credential environment variable before child commands.',
                '',
                'Seven isolated command-stub regression cases pass locally and in CI. With the owner’s approval, the feature history was rewritten while preserving the final file tree, commit authors and messages. [GitGuardian on 97ea92e](https://github.com/willamhou/beamhop/pull/7/checks?check_run_id=118436760729) scanned all 25 feature commits and reported **No secrets detected**.',
                '',
                '**Existing Mac keychains still need password rotation wherever the former default was used.** No Mac was accessed or rotated from this Windows session. See [the remediation guide](https://github.com/willamhou/beamhop/blob/feat/phase15-detail-chain/docs/dev-signing-security.md). History cleanup does not retract existing clones or cached commit pages.'
              ].join('\n');
              await github.rest.pulls.update({...context.repo, pull_number: 7, body: (pr.body || '') + '\n\n' + note});
            }
