name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build all Swift products
        run: |
          set -o pipefail
          swift build 2>&1 | tee swift-build.log
      - name: Swift tests (BeamhopCore)
        run: swift test
      - name: Self-test (storage, handoff, focus and Inbox)
        run: swift run BeamhopSelfTest
      - name: MCP stdio smoke test (S1 framing + seeded content)
        run: scripts/mcp-smoke.sh
      - name: Hop identity and optional conclusion protocol regression
        run: |
          binary_dir="$(swift build --show-bin-path)"
          python3 scripts/hop-return-smoke.py --mcp-binary "$binary_dir/BeamhopMCP" --seed-binary "$binary_dir/BeamhopSelfTest"
      - name: Native messaging host compiles
        run: swiftc -O host/main.swift -o /tmp/beamhop-bridge
      - name: Native manifest installer smoke test
        run: scripts/native-manifest-smoke.sh
      - name: Assemble Beamhop.app (ad-hoc)
        run: ./packaging/build-app.sh
      - name: Native UI interactions and screenshots
        run: bash scripts/native-ui-smoke.sh
      - name: Offscreen diagnostics privacy and UI fixtures
        run: |
          dist/Beamhop.app/Contents/MacOS/Beamhop --trial-ui-smoke dist/ui-smoke/trial -AppleLanguages '(en)'
          dist/Beamhop.app/Contents/MacOS/Beamhop --trial-ui-smoke dist/ui-smoke/trial --dark -AppleLanguages '(en)'
          dist/Beamhop.app/Contents/MacOS/Beamhop --trial-ui-smoke dist/ui-smoke/trial --zh -AppleLanguages '(zh-Hans)'
          dist/Beamhop.app/Contents/MacOS/Beamhop --trial-ui-smoke dist/ui-smoke/trial --zh --dark -AppleLanguages '(zh-Hans)'
      - name: Native focus and Inbox write-back regression
        timeout-minutes: 3
        run: |
          set -o pipefail
          "$(swift build --show-bin-path)/Beamhop" --ui-regression dist/ui-smoke/focus-inbox 2>&1 | tee dist/ui-smoke/focus-inbox.log
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beamhop-native-ui-${{ github.sha }}
          path: dist/ui-smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beamhop-build-log-${{ github.sha }}
          path: swift-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Archive Beamhop.app with executable permissions
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
        run: ditto -c -k --sequesterRsrc --keepParent dist/Beamhop.app dist/Beamhop-macOS.zip
      - name: Upload Beamhop.app artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
        uses: actions/upload-artifact@v4
        with:
          name: Beamhop-app-${{ github.sha }}
          path: dist/Beamhop-macOS.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload build provenance receipts
        uses: actions/upload-artifact@v4
        with:
          name: Beamhop-build-records-${{ github.sha }}
          path: dist/build-records
          if-no-files-found: error
          retention-days: 30

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Bundle produced
        run: test -s ../vendor/readability.js

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Development signing credential regression checks
        run: python3 scripts/dev-signing-smoke.py
      - name: Build provenance regression checks
        run: python3 scripts/build-provenance-smoke.py
      - name: ShellCheck all shell scripts
        run: |
          find scripts host packaging cowork-extension -name '*.sh' -print0 | xargs -0 shellcheck
