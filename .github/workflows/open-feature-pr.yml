name: Open phase15 review

on:
  push:
    branches: [feat/phase15-detail-chain]
    paths: [.github/workflows/open-feature-pr.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const params = {
              ...context.repo,
              head: 'feat/phase15-detail-chain',
              base: 'main',
              title: 'Refine native capture handoffs, add the corner shelf and Inbox timeline',
              body: fs.readFileSync('.github/phase15-pr-body.md', 'utf8'),
              draft: true
            };
            try {
              const existing = await github.rest.pulls.list({
                ...context.repo, state: 'open',
                head: `${context.repo.owner}:feat/phase15-detail-chain`, base: 'main'
              });
              const pr = existing.data[0] || (await github.rest.pulls.create(params)).data;
              fs.writeFileSync('pr-result.json', JSON.stringify({number: pr.number, url: pr.html_url, draft: pr.draft}, null, 2));
              await core.summary.addLink('Review pull request', pr.html_url).write();
            } catch (error) {
              fs.writeFileSync('pr-result.json', JSON.stringify({status: error.status, error: error.message}, null, 2));
              core.setFailed(error.message);
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-pr-result
          path: pr-result.json
          retention-days: 7
